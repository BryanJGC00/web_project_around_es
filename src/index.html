<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <!-- Nuevo contenedor para overlay -->
            <img class="profile__image" src="" alt="Avatar" />
            <!-- Cambiado: src vacío, se carga desde server -->
            <button
              class="profile__edit-avatar-button"
              type="button"
              aria-label="Editar avatar"
            ></button>
            <!-- Nuevo botón para editar avatar -->
          </div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <p class="profile__description"></p>
            <button
              class="profile__edit-button"
              type="button"
              aria-label="Editar perfil"
            ></button>
          </div>
          <button
            class="profile__add-button"
            type="button"
            aria-label="Agregar card"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">&copy; 2026 Around The U.S.</p>
      </footer>
    </div>

    <!-- Popup Edit Profile -->
    <div class="popup popup_type_edit" id="edit-popup">
      <div class="popup__content">
        <button class="popup__close" type="button" aria-label="Cerrar"></button>
        <h3 class="popup__title">Editar perfil</h3>
        <form
          class="popup__form"
          name="edit-profile"
          novalidate
          autocomplete="off"
        >
          <input
            class="popup__input"
            id="name"
            name="name"
            placeholder="Nombre"
            required
            type="text"
            minlength="2"
            maxlength="40"
            autocomplete="name"
          />
          <span id="name-error" class="popup__error"></span>
          <input
            class="popup__input"
            id="about"
            name="about"
            placeholder="Acerca de mí"
            required
            type="text"
            minlength="2"
            maxlength="200"
            autocomplete="work"
          />
          <span id="about-error" class="popup__error"></span>
          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <!-- Popup Edit Avatar -->
    <div class="popup popup_type_edit_avatar" id="edit-avatar-popup">
      <div class="popup__content">
        <button class="popup__close" type="button" aria-label="Cerrar"></button>
        <h3 class="popup__title">Cambiar foto de perfil</h3>
        <form class="popup__form" name="edit-avatar" novalidate>
          <input
            class="popup__input"
            id="avatar"
            name="avatar"
            placeholder="URL de la imagen"
            required
            type="url"
            autocomplete="url"
          />
          <span id="avatar-error" class="popup__error"></span>
          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <!-- Popup New Card -->
    <div class="popup popup_type_new-card" id="new-card-popup">
      <div class="popup__content">
        <button class="popup__close" type="button" aria-label="Cerrar"></button>
        <h3 class="popup__title">Nuevo lugar</h3>
        <form class="popup__form" name="new-place" novalidate>
          <input
            class="popup__input"
            id="card-name"
            name="name"
            placeholder="Título"
            required
            type="text"
            minlength="2"
            maxlength="30"
            autocomplete="country-name"
          />
          <span id="card-name-error" class="popup__error"></span>
          <input
            class="popup__input"
            id="card-link"
            name="link"
            placeholder="Enlace a la imagen"
            required
            type="url"
            autocomplete="url"
          />
          <span id="card-link-error" class="popup__error"></span>
          <button class="popup__button" type="submit">Guardar</button>
        </form>
      </div>
    </div>

    <!-- Popup Imagen -->
    <div class="popup popup_type_image" id="image-popup">
      <div class="popup__content popup__content_content_image">
        <button class="popup__close" type="button" aria-label="Cerrar"></button>
        <img alt="" class="popup__image" src="./images/placeholder.jpg" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <!-- Nuevo Popup Confirmación Delete -->
    <div class="popup popup_type_confirm" id="confirm-delete-popup">
      <div class="popup__content">
        <button class="popup__close" type="button" aria-label="Cerrar"></button>
        <h2 class="popup__title">¿Estás seguro/a?</h2>
        <button class="popup__confirm-button" type="button">Sí</button>
      </div>
    </div>

    <!-- Template para Cards -->
    <template id="card-template">
      <li class="card">
        <img class="card__image" src="#" alt="" />
        <button
          aria-label="Eliminar tarjeta"
          class="card__delete-button"
          type="button"
        ></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            aria-label="Botón Me gusta"
            class="card__like-button"
            type="button"
          ></button>
        </div>
      </li>
    </template>
  </body>
  <script type="module" src="./pages/index.js"></script>
</html>
